<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Sesión</title>
  <style>
    :root{--bg:#f7f7fb;--card:#fff;--pri:#2563eb;--text:#111827;--muted:#6b7280;}
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:system-ui,Roboto,Arial;color:var(--text);background:var(--bg)}
    .card{background:var(--card);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:16px;margin:auto;max-width:820px}
    h1{font-size:20px;margin:0 0 12px}
    label{display:block;font-weight:600;margin:14px 0 6px}
    select,input,textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font:inherit;background:#fff}
    textarea{min-height:80px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .muted{color:var(--muted);font-size:12px}
    .btn{display:inline-block;border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn-ghost{background:#eef2ff;color:#3730a3}
    .btn-primary{background:var(--pri);color:#fff}
    .program{border:1px dashed #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff}
    .program h3{margin:0 0 8px;font-size:15px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:8px 10px;border:1px solid #e5e7eb;border-radius:999px}
    .actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
    .danger{color:#b91c1c}
  </style>
</head>
<body>
  <div class="card">
    <h1>Registro de sesión</h1>

    <form id="sessionForm" autocomplete="off">
      <label for="terapeuta">Terapeuta</label>
      <select id="terapeuta" name="terapeuta">
        <option value="">-- selecciona terapeuta --</option>
      </select>

      <label for="estudiante">Estudiante</label>
      <select id="estudiante" name="estudiante">
        <option value="">-- selecciona estudiante --</option>
      </select>

      <div class="actions">
        <button type="button" id="addProgramBtn" class="btn btn-ghost">+ Agregar Programa</button>
      </div>

      <div id="programasContainer"></div>

      <div class="actions">
        <span class="muted">Se enviará una fila a Sheets por cada programa.</span>
        <button type="submit" class="btn btn-primary">Guardar Sesión</button>
      </div>
    </form>
  </div>

  <script>
    /*****************  CONFIG  *****************/
    // ⚠️ Reemplaza con TU URL de Apps Script (implementado como web app)
    const scriptUrl = 'PASTE_AQUI_TU_URL_DE_APPS_SCRIPT';

    // Opciones de ejemplo. Rellena con tus valores reales o cárgalos como prefieras.
    const TERAPEUTAS = ['Laura', 'Andrea', 'María'];
    const ESTUDIANTES = ['Ana P.', 'Luis R.', 'Marco T.'];
    const PROGRAMAS = ['Discriminación de olores', 'Búsqueda dirigida', 'Marcaje sit&stare'];

    /***************  UI Helpers  ***************/
    function fillSelect(select, items, placeholder) {
      select.innerHTML = '';
      const ph = document.createElement('option');
      ph.value = ''; ph.textContent = placeholder || '-- selecciona --';
      select.appendChild(ph);
      items.forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = v;
        select.appendChild(o);
      });
    }

    function addProgramBlock() {
      const cont = document.getElementById('programasContainer');
      const idx = cont.children.length + 1;

      const div = document.createElement('div');
      div.className = 'program';
      div.innerHTML = `
        <div class="actions" style="margin-top:0">
          <h3>Programa #${idx}</h3>
          <button type="button" class="btn btn-ghost danger remove-program">Eliminar</button>
        </div>

        <label>Programa</label>
        <select name="programa[]">
          ${PROGRAMAS.map(p => `<option value="${p}">${p}</option>`).join('')}
        </select>

        <div class="row-3">
          <div>
            <label>Conjuntos</label>
            <input type="number" min="0" name="conj[]" value="0">
          </div>
          <div>
            <label>Elementos</label>
            <input type="number" min="0" name="elementos[]" value="0">
          </div>
          <div>
            <label>Tipo Refuerzo</label>
            <select name="tipoRef[]">
              <option value="comida">Comida</option>
              <option value="juego">Juego</option>
              <option value="social">Social</option>
            </select>
          </div>
        </div>

        <div class="row-3">
          <div>
            <label>Positivos</label>
            <input type="number" min="0" name="positivos[]" value="0">
          </div>
          <div>
            <label>Negativos</label>
            <input type="number" min="0" name="negativos[]" value="0">
          </div>
          <div>
            <label>Tiempo con Papás (min)</label>
            <input type="number" min="0" name="tiempoPapas[]" value="0">
          </div>
        </div>

        <div class="row">
          <div>
            <label>Tiempo en Colegio (min)</label>
            <input type="number" min="0" name="tiempoColegio[]" value="0">
          </div>
          <div>
            <label>Comportamiento observado</label>
            <textarea name="comportamiento[]"></textarea>
          </div>
        </div>

        <label>Ayudas aplicadas</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" name="ayudaVerbal[]" value="verbal"> Verbal</label>
          <label class="chip"><input type="checkbox" name="ayudaFisica[]" value="fisica"> Física</label>
          <label class="chip"><input type="checkbox" name="ayudaGestual[]" value="gestual"> Gestual</label>
        </div>

        <label>Comentario</label>
        <textarea name="comentario[]"></textarea>
      `;

      div.querySelector('.remove-program').onclick = () => {
        div.remove();
        // Reindex visual
        [...document.querySelectorAll('#programasContainer .program h3')].forEach((h, i) => h.textContent = 'Programa #' + (i+1));
      };

      cont.appendChild(div);
    }

    /***************  Inicialización  ***************/
    window.addEventListener('load', () => {
      fillSelect(document.getElementById('terapeuta'), TERAPEUTAS, '-- selecciona terapeuta --');
      fillSelect(document.getElementById('estudiante'), ESTUDIANTES, '-- selecciona estudiante --');
      document.getElementById('addProgramBtn').onclick = addProgramBlock;
    });

    /***************  Envío robusto  ***************/
    // POST con XHR como antes, envuelto en Promesa
    function postFormData(fd) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', scriptUrl, true);
        xhr.onload = () => (xhr.status === 200 ? resolve() : reject(new Error('HTTP ' + xhr.status)));
        xhr.onerror = () => reject(new Error('network'));
        xhr.send(fd);
      });
    }

    // Añade clave normal y con [] para compatibilidad en Apps Script
    function appendDual(fd, key, value) {
      if (value == null) value = '';
      fd.append(key, value);
      fd.append(key + '[]', value);
    }

    // Un POST por cada bloque de programa (independiente del parseo de arrays)
    document.getElementById('sessionForm').onsubmit = async function(e){
      e.preventDefault();

      const terapeuta = document.getElementById('terapeuta').value.trim();
      const estudiante = document.getElementById('estudiante').value.trim();
      const blocks = Array.from(document.querySelectorAll('#programasContainer .program'));
      const submitBtn = this.querySelector('button[type="submit"]');

      if (!scriptUrl || scriptUrl.includes('PASTE_AQUI')) { alert('Configura "scriptUrl" con tu URL de Apps Script.'); return; }
      if (!terapeuta || !estudiante) { alert('Selecciona terapeuta y estudiante.'); return; }
      if (blocks.length === 0) { alert('Agrega al menos un programa.'); return; }

      submitBtn.disabled = true;
      const original = submitBtn.textContent;
      submitBtn.textContent = 'Guardando...';

      let ok = 0, failed = [];

      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        const getVal = (sel) => (b.querySelector(sel)?.value || '').trim();

        const fd = new FormData();
        fd.append('action', 'saveSession');

        // Comunes a todos
        appendDual(fd, 'terapeuta', terapeuta);
        appendDual(fd, 'estudiante', estudiante);

        // Campos del bloque
        appendDual(fd, 'programa',       getVal('select[name="programa[]"]'));
        appendDual(fd, 'conj',           getVal('input[name="conj[]"]'));
        appendDual(fd, 'elementos',      getVal('input[name="elementos[]"]'));
        appendDual(fd, 'positivos',      getVal('input[name="positivos[]"]'));
        appendDual(fd, 'negativos',      getVal('input[name="negativos[]"]'));
        appendDual(fd, 'tipoRef',        getVal('select[name="tipoRef[]"]'));
        appendDual(fd, 'tiempoColegio',  getVal('input[name="tiempoColegio[]"]'));
        appendDual(fd, 'tiempoPapas',    getVal('input[name="tiempoPapas[]"]'));
        appendDual(fd, 'comportamiento', getVal('textarea[name="comportamiento[]"]'));
        appendDual(fd, 'comentario',     getVal('textarea[name="comentario[]"]'));

        // Ayudas (checkboxes con names terminados en [])
        const ayudas = b.querySelectorAll('input[type="checkbox"][name$="[]"]:checked');
        ayudas.forEach(chk => {
          fd.append(chk.name, chk.value);                 // con []
          fd.append(chk.name.replace('[]',''), chk.value);// sin []
        });

        try { await postFormData(fd); ok++; }
        catch (err) { failed.push(i+1); }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = original;

      if (failed.length) {
        alert(`Guardado parcial: ${ok}/${blocks.length}. Falló en: ${failed.join(', ')}`);
      } else {
        alert(`Sesión guardada correctamente (${ok} programa/s).`);
        // Limpieza opcional:
        // this.reset(); document.getElementById('programasContainer').innerHTML='';
      }
    };
  </script>
</body>
</html>
