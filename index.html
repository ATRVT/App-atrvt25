<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de sesión</title>
  <style>
    :root{--bg:#f7f7fb;--card:#fff;--pri:#2563eb;--text:#111827;--muted:#6b7280;}
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:system-ui,Roboto,Arial;color:var(--text);background:var(--bg)}
    .card{background:var(--card);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:16px;margin:auto;max-width:820px}
    h1{font-size:20px;margin:0 0 12px}
    label{display:block;font-weight:600;margin:14px 0 6px}
    select,input,textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font:inherit;background:#fff}
    textarea{min-height:80px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .muted{color:var(--muted);font-size:12px}
    .btn{display:inline-block;border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn-ghost{background:#eef2ff;color:#3730a3}
    .btn-primary{background:var(--pri);color:#fff}
    .program{border:1px dashed #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff}
    .program h3{margin:0 0 8px;font-size:15px}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;white-space:nowrap}
    .chip input{margin:0}
    .actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
    .danger{color:#b91c1c}
  </style>
</head>
<body>
  <div class="card">
    <h1>Registro de sesión</h1>

    <form id="sessionForm" autocomplete="off">
      <label for="terapeuta">Terapeuta</label>
      <select id="terapeuta" name="terapeuta">
        <option value="">Cargando…</option>
      </select>

      <label for="estudiante">Estudiante</label>
      <select id="estudiante" name="estudiante">
        <option value="">Cargando…</option>
      </select>

      <div class="actions">
        <button type="button" id="addProgramBtn" class="btn btn-ghost">+ Agregar Programa</button>
      </div>

      <div id="programasContainer"></div>

      <div class="actions">
        <span class="muted">Se enviará una fila a Sheets por cada programa.</span>
        <button type="submit" class="btn btn-primary">Guardar Sesión</button>
      </div>
    </form>
  </div>

  <script>
    /* ========= CONFIGURA AQUÍ TU WEB APP ========= */
    // Pega la URL que termina en /exec
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbzgKZglSpsm6t2UHxEO26609C2EmzIENUEaLODL9BwoROeLn-qxIXaDmWg4dFF5Xpf_XA/exec';

    /* ===== Helpers genéricos ===== */
    function option(el, value, text){ const o=document.createElement('option'); o.value=value; o.textContent=text; el.appendChild(o); }
    function fillSelect(select, items, placeholder){
      select.innerHTML=''; option(select,'',placeholder||'-- selecciona --');
      (items||[]).forEach(v=> option(select,v,v));
    }
    // POST “compatible” (evita CORS en Safari/iOS usando FormData)
    function postJSON(url, data){
      return new Promise((resolve, reject)=>{
        try{
          const fd = new FormData();
          Object.keys(data||{}).forEach(k=>fd.append(k, data[k]));
          const xhr = new XMLHttpRequest();
          xhr.open('POST', url, true);
          xhr.onload  = ()=>{ if (xhr.status===200){ try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ reject(e); } } else reject(new Error('HTTP '+xhr.status)); };
          xhr.onerror = ()=> reject(new Error('network'));
          xhr.send(fd);
        }catch(err){ reject(err); }
      });
    }

    /* ===== UI: bloque de programa ===== */
    function addProgramBlock(config){
      const cont = document.getElementById('programasContainer');
      const idx  = cont.children.length + 1;
      const div  = document.createElement('div');
      div.className='program';
      div.innerHTML = `
        <div class="actions" style="margin-top:0">
          <h3>Programa #${idx}</h3>
          <button type="button" class="btn btn-ghost danger remove-program">Eliminar</button>
        </div>

        <label>Programa</label>
        <select name="programa[]"></select>

        <div class="row-3">
          <div><label>Conjuntos</label><input type="number" min="0" name="conj[]" value="0"></div>
          <div><label>Elementos</label><input type="number" min="0" name="elementos[]" value="0"></div>
          <div>
            <label>Tipo Refuerzo</label>
            <select name="tipoRef[]"></select>
          </div>
        </div>

        <div class="row-3">
          <div><label>Positivos</label><input type="number" min="0" name="positivos[]" value="0"></div>
          <div><label>Negativos</label><input type="number" min="0" name="negativos[]" value="0"></div>
          <div><label>Tiempo con Papás (min)</label><input type="number" min="0" name="tiempoPapas[]" value="0"></div>
        </div>

        <div class="row">
          <div><label>Tiempo en Colegio (min)</label><input type="number" min="0" name="tiempoColegio[]" value="0"></div>
          <div><label>Comportamiento observado</label><textarea name="comportamiento[]"></textarea></div>
        </div>

        <label>Ayudas aplicadas</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" name="ayudaVerbal[]"  value="verbal"> Verbal</label>
          <label class="chip"><input type="checkbox" name="ayudaFisica[]"  value="fisica"> Física</label>
          <label class="chip"><input type="checkbox" name="ayudaGestual[]" value="gestual"> Gestual</label>
        </div>

        <label>Comentario</label>
        <textarea name="comentario[]"></textarea>
      `;
      div.querySelector('.remove-program').onclick = () => {
        div.remove(); [...document.querySelectorAll('#programasContainer .program h3')].forEach((h,i)=>h.textContent='Programa #'+(i+1));
      };
      cont.appendChild(div);

      // Llenar selects Programa y TipoRef desde config real
      fillSelect(div.querySelector('select[name="programa[]"]'), (config.programas||[]), '-- selecciona programa --');
      const tiposRef = (config.tiposRef && config.tiposRef.length) ? config.tiposRef : ['Comida','Juego','Social'];
      fillSelect(div.querySelector('select[name="tipoRef[]"]'), tiposRef, '-- selecciona tipo --');
    }

    /* ===== Config desde tu hoja (POST para evitar CORS) ===== */
    async function loadConfig(){
      try{
        if (!scriptUrl || !/\/exec$/.test(scriptUrl)) throw new Error('Configura "scriptUrl" con tu URL del Web App (/exec).');

        const data = await postJSON(scriptUrl, { action:'getConfig' });
        const config = {
          terapeutas:  data.terapeutas  || [],
          estudiantes: data.estudiantes || [],
          programas:   data.programas   || [],
          tiposRef:    data.tiposRef    || []
        };

        fillSelect(document.getElementById('terapeuta'), config.terapeutas, '-- selecciona terapeuta --');
        fillSelect(document.getElementById('estudiante'), config.estudiantes, '-- selecciona estudiante --');

        document.getElementById('addProgramBtn').onclick = () => addProgramBlock(config);
        if (document.getElementById('programasContainer').children.length===0){ addProgramBlock(config); }
      }catch(err){
        alert(err.message || 'Load failed');
        // Fallback mínimo para que no quede bloqueada la UI:
        const empty = []; fillSelect(document.getElementById('terapeuta'), empty, '-- selecciona terapeuta --');
        fillSelect(document.getElementById('estudiante'), empty, '-- selecciona estudiante --');
        document.getElementById('addProgramBtn').onclick = () => addProgramBlock({programas:[],tiposRef:[]});
        if (document.getElementById('programasContainer').children.length===0){ addProgramBlock({programas:[],tiposRef:[]}); }
      }
    }

    /* ===== Envío robusto: 1 POST por programa (a prueba de todo) ===== */
    function postFormData(fd){
      return new Promise((resolve,reject)=>{
        const xhr = new XMLHttpRequest();
        xhr.open('POST', scriptUrl, true);
        xhr.onload  = () => (xhr.status===200 ? resolve() : reject(new Error('HTTP '+xhr.status)));
        xhr.onerror = () => reject(new Error('network'));
        xhr.send(fd);
      });
    }
    function appendDual(fd,key,value){
      if(value==null) value='';
      fd.append(key, value);      // sin []
      fd.append(key+'[]', value); // con []
    }

    document.getElementById('sessionForm').onsubmit = async function(e){
      e.preventDefault();

      const terapeuta  = (document.getElementById('terapeuta')?.value || '').trim();
      const estudiante = (document.getElementById('estudiante')?.value || '').trim();
      const blocks = Array.from(document.querySelectorAll('#programasContainer .program'));
      const submitBtn = this.querySelector('button[type="submit"]');

      if (!scriptUrl || !/\/exec$/.test(scriptUrl)) { alert('Configura "scriptUrl" con tu URL del Web App (/exec).'); return; }
      if (!terapeuta || !estudiante) { alert('Selecciona terapeuta y estudiante.'); return; }
      if (blocks.length===0) { alert('Agrega al menos un programa.'); return; }

      submitBtn.disabled=true; const original=submitBtn.textContent; submitBtn.textContent='Guardando…';

      let ok=0, failed=[];
      for(let i=0;i<blocks.length;i++){
        const b = blocks[i];
        const val = (sel) => (b.querySelector(sel)?.value || '').trim();

        const fd = new FormData();
        fd.append('action','saveSession');

        // comunes
        appendDual(fd,'terapeuta',terapeuta);
        appendDual(fd,'estudiante',estudiante);

        // del bloque
        appendDual(fd,'programa',       val('select[name="programa[]"]'));
        appendDual(fd,'conj',           val('input[name="conj[]"]'));
        appendDual(fd,'elementos',      val('input[name="elementos[]"]'));
        appendDual(fd,'positivos',      val('input[name="positivos[]"]'));
        appendDual(fd,'negativos',      val('input[name="negativos[]"]'));
        appendDual(fd,'tipoRef',        val('select[name="tipoRef[]"]'));
        appendDual(fd,'tiempoColegio',  val('input[name="tiempoColegio[]"]'));
        appendDual(fd,'tiempoPapas',    val('input[name="tiempoPapas[]"]'));
        appendDual(fd,'comportamiento', val('textarea[name="comportamiento[]"]'));
        appendDual(fd,'comentario',     val('textarea[name="comentario[]"]'));

        // ayudas
        b.querySelectorAll('input[type="checkbox"][name^="ayuda"]:checked').forEach(chk=>{
          const base = chk.name.replace(/\[\]$/,'');
          fd.append(base, chk.value);
          fd.append(base+'[]', chk.value);
        });

        try{ await postFormData(fd); ok++; }
        catch(err){ failed.push(i+1); }
      }

      submitBtn.disabled=false; submitBtn.textContent=original;

      if (failed.length){
        alert(`Guardado parcial: ${ok}/${blocks.length}. Falló en: ${failed.join(', ')}`);
      } else {
        alert(`Sesión guardada correctamente (${ok} programa/s).`);
        // Limpieza opcional:
        // this.reset(); document.getElementById('programasContainer').innerHTML='';
      }
    };

    // Inicializa
    window.addEventListener('load', loadConfig);
  </script>
</body>
</html>
