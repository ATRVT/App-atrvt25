<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATRÉVETE</title>
  <style>
    body { font-family: Arial, sans-serif; padding:10px; }
    h1 { margin-bottom:20px; }
    .tabs { display:flex; margin-bottom:10px; }
    .tab { flex:1; padding:8px; text-align:center; cursor:pointer; border:1px solid #ccc; background:#f0f0f0; }
    .tab.active { background:#fff; font-weight:bold; border-bottom:none; }
    .section { display:none; }
    .section.active { display:block; }
    fieldset { margin-bottom:15px; padding:10px; border:1px solid #ccc; }
    label, legend { display:block; margin-top:8px; }
    input, select, button { width:100%; padding:8px; margin-top:5px; box-sizing:border-box; }
    button { height:44px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
    .delete-btn { background:transparent; border:1px solid #e74c3c; color:#e74c3c; padding:4px 8px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>ATRÉVETE</h1>
  <div class="tabs">
    <div id="tab-form" class="tab active">Sesión</div>
    <div id="tab-config" class="tab">Configuración</div>
  </div>

  <!-- Sección Sesión -->
  <div id="section-form" class="section active">
    <!-- Aquí tu formulario de sesiones -->
    <p>Formulario de sesión (mantener el existente).</p>
  </div>

  <!-- Sección Configuración -->
  <div id="section-config" class="section">
    <fieldset>
      <legend>Terapeutas</legend>
      <button id="toggle-terapeutas" type="button">Mostrar Terapeutas</button>
      <div id="list-terapeutas" style="display:none; margin-top:10px;"></div>
      <input id="new-terapeuta" placeholder="Nuevo terapeuta">
    </fieldset>
    <fieldset>
      <legend>Estudiantes</legend>
      <button id="toggle-estudiantes" type="button">Mostrar Estudiantes</button>
      <div id="list-estudiantes" style="display:none; margin-top:10px;"></div>
      <input id="new-estudiante" placeholder="Nuevo estudiante">
    </fieldset>
    <fieldset>
      <legend>Programas</legend>
      <button id="toggle-programas" type="button">Mostrar Programas</button>
      <div id="list-programas" style="display:none; margin-top:10px;"></div>
      <input id="new-programa" placeholder="Nuevo programa">
    </fieldset>
    <button id="save-config-btn" type="button">Guardar Configuración</button>
  </div>

  <script>
    // URL de tu Web App de Apps Script:
    var scriptUrl = 'https://script.google.com/macros/s/AKfycbxpuRuQqYozRLDdkVr-sCWrzZ1_TxSl_Jdrr_8z8Sk_GKaSxYDid2wzV3v4KXhqv79k/exec';

    // Llamada genérica GET
    function apiGet(params, cb) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', scriptUrl + '?' + params, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try { cb(null, JSON.parse(xhr.responseText)); }
          catch(e) { cb(e); }
        } else cb(new Error('HTTP ' + xhr.status));
      };
      xhr.onerror = function() { cb(new Error('Network error')); };
      xhr.send();
    }

    // Variables de configuración
    var terapeutas = [], estudiantes = [], programas = [];

    // Carga inicial
    function loadConfig() {
      apiGet('action=getConfig', function(err, res) {
        if (!err && res.status === 'success') {
          terapeutas = res.config.terapeutas;
          estudiantes = res.config.estudiantes;
          programas   = res.config.programas;
        }
        renderConfigLists();
      });
    }

    // Renderizar listas en configuración
    function renderList(id, type, arr) {
      var container = document.getElementById(id);
      container.innerHTML = '';
      arr.forEach(function(name) {
        var div = document.createElement('div'); div.className = 'list-item';
        var span = document.createElement('span'); span.textContent = name;
        var btn  = document.createElement('button'); btn.className = 'delete-btn'; btn.textContent = 'Eliminar';
        btn.onclick = function() {
          if (!confirm('Eliminar ' + name + '?')) return;
          apiGet('action=saveConfig&type=' + type + '&name=' + encodeURIComponent(name) + '&remove=true', loadConfig);
        };
        div.appendChild(span);
        div.appendChild(btn);
        container.appendChild(div);
      });
    }
    function renderConfigLists() {
      renderList('list-terapeutas', 'terapeuta', terapeutas);
      renderList('list-estudiantes','estudiante', estudiantes);
      renderList('list-programas','programa', programas);
    }

    // Guardar nuevos ítems
    document.getElementById('save-config-btn').onclick = function() {
      var t = document.getElementById('new-terapeuta').value.trim();
      var e = document.getElementById('new-estudiante').value.trim();
      var p = document.getElementById('new-programa').value.trim();
      var count = 0;
      function done() { if (--count <= 0) loadConfig(); }
      if (t) { count++; apiGet('action=saveConfig&type=terapeuta&name=' + encodeURIComponent(t), done); }
      if (e) { count++; apiGet('action=saveConfig&type=estudiante&name=' + encodeURIComponent(e), done); }
      if (p) { count++; apiGet('action=saveConfig&type=programa&name=' + encodeURIComponent(p), done); }
      document.getElementById('new-terapeuta').value = '';
      document.getElementById('new-estudiante').value = '';
      document.getElementById('new-programa').value = '';
      if (count === 0) loadConfig();
    };

    // Toggle mostrar/ocultar
    document.getElementById('toggle-terapeutas').onclick = function() {
      var d = document.getElementById('list-terapeutas');
      d.style.display = d.style.display === 'none' ? 'block' : 'none';
      this.textContent = d.style.display === 'block' ? 'Ocultar Terapeutas' : 'Mostrar Terapeutas';
    };
    document.getElementById('toggle-estudiantes').onclick = function() {
      var d = document.getElementById('list-estudiantes');
      d.style.display = d.style.display === 'none' ? 'block' : 'none';
      this.textContent = d.style.display === 'block' ? 'Ocultar Estudiantes' : 'Mostrar Estudiantes';
    };
    document.getElementById('toggle-programas').onclick = function() {
      var d = document.getElementById('list-programas');
      d.style.display = d.style.display === 'none' ? 'block' : 'none';
      this.textContent = d.style.display === 'block' ? 'Ocultar Programas' : 'Mostrar Programas';
    };

    // Pestañas
    function show(tab) {
      document.getElementById('tab-form').classList.toggle('active', tab === 'form');
      document.getElementById('tab-config').classList.toggle('active', tab === 'config');
      document.getElementById('section-form').classList.toggle('active', tab === 'form');
      document.getElementById('section-config').classList.toggle('active', tab === 'config');
    }
    document.getElementById('tab-form').onclick = function() { show('form'); };
    document.getElementById('tab-config').onclick = function() { show('config'); };

    // Al cargar la página
    window.addEventListener('load', function() {
      loadConfig();
      show('form');
    });
  </script>
</body>
</html>
