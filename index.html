<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATRÉVETE</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:10px; }
    h1 { font-size:24px; margin-bottom:20px; }
    .tabs { display:flex; margin-bottom:10px; }
    .tab { flex:1; padding:10px; text-align:center; cursor:pointer; background:#f0f0f0; border:1px solid #ccc; }
    .tab.active { background:#fff; border-bottom:none; font-weight:bold; }
    .section { display:none; }
    .section.active { display:block; }
    label, legend { display:block; margin-top:10px; font-size:16px; }
    select, input, textarea, button { width:100%; font-size:16px; padding:8px; box-sizing:border-box; margin-top:5px; }
    button { height:48px; }
    .program { border:1px solid #ccc; margin-top:10px; padding:10px; }
    .config-section { }
    .list-item { display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
    .delete-btn { background:transparent; color:#e74c3c; border:1px solid #e74c3c; padding:5px 8px; cursor:pointer; border-radius:4px; }
    fieldset { border:1px solid #ccc; margin-top:15px; padding:10px; }
    .checkbox-group { display:flex; flex-wrap:wrap; margin-top:5px; }
    .checkbox-group label { width:48%; }
  </style>
</head>
<body>
  <h1>ATRÉVETE</h1>

  <!-- Navegación de pestañas -->
  <div class="tabs">
    <div id="tab-form" class="tab active">Sesión</div>
    <div id="tab-config" class="tab">Configuración</div>
  </div>

  <!-- Sección: Formulario de Sesión -->
  <div id="section-form" class="section active">
    <form id="sessionForm">
      <label for="terapeuta">Terapeuta</label>
      <select id="terapeuta" name="terapeuta"><option value="">-- selecciona terapeuta --</option></select>

      <label for="estudiante">Estudiante</label>
      <select id="estudiante" name="estudiante"><option value="">-- selecciona estudiante --</option></select>

      <div id="programasContainer"></div>
      <button type="button" id="addProgramBtn">+ Agregar Programa</button>
      <button type="submit">Guardar Sesión</button>
    </form>
  </div>

  <!-- Sección: Configuración de Listas -->
  <div id="section-config" class="section">
    <div class="config-section">
      <h2>⚙️ Configuración</h2>
      <fieldset>
        <legend>Terapeutas</legend>
        <div id="list-terapeutas"></div>
        <input type="text" id="new-terapeuta" placeholder="Nombre nuevo terapeuta">
        <button type="button" id="add-terapeuta-btn">Añadir terapeuta</button>
      </fieldset>

      <fieldset>
        <legend>Estudiantes</legend>
        <div id="list-estudiantes"></div>
        <input type="text" id="new-estudiante" placeholder="Nombre nuevo estudiante">
        <button type="button" id="add-estudiante-btn">Añadir estudiante</button>
      </fieldset>

      <fieldset>
        <legend>Programas</legend>
        <div id="list-programas" style="max-height:150px; overflow:auto;"></div>
        <input type="text" id="new-programa" placeholder="Nombre nuevo programa">
        <button type="button" id="add-programa-btn">Añadir programa</button>
      </fieldset>
    </div>
  </div>

  <script>
    var scriptUrl = 'https://script.google.com/macros/s/AKfycbwcUJL_6IOB7C_d2vvZmtKntyRfdbYnZfJYVMxT_MyE6SPTMwjmHP7n-1cXMNbf8j20Xg/exec';
    // Arrays por defecto
    var defaultTerapeutas = ["Adriana J","Celeste M","Cinthia","Dani R","Estefanie","Gaby A","Gaby X","Geovanna","Jacky S","Jessi G","Jessica P","Luisa D","Melissa P","Meli Peña","Paty","Rocío M","Suly S","Tere M","Zamy"];
    var defaultEstudiantes = ["Abraham Chapetón","Adolfo Hernández","Adrián","Adriana García","Amber Lafage","Ana María","Andrei González","Andrés Cruz","Ángel Gabriel","Ángel Gudiel","Bruno Arévalo","Bruno Torres","Christopher Gamas","Cristian Molina","Daniel Samayoa","Diego Lima","Diego Pérez","Dylan Ceijas","Ethan Forno","Fabián Álvarez","Gabriel Ruíz","Ivanna Recinos","Javier Maldonado","Jorge Sánchez","José Miguel López","Julio González","Luis André Arriola","Luis Felipe Guzmán","Mariana Solís","Mateo Toribio","Mathías Mendoza","Matías Contreras","Matías Guaré","Matías Osorio","Miranda Martínez","Nicholas Mancilla","Pablo Vielman","René Torres","Rodrigo Chigüichon","Santiago Ruíz","Tier Xitumul","Xander García"];
    var defaultProgramas = [
      "Agilidad mental","Aleatorio acciones","Aleatorio búsqueda de objetos","Aleatorio emociones","Aleatorio dictado números",
      "Aleatorio ecoicas fonemas","Aleatorio intraverbales","Aleatorio ecoicas palabras","Aleatorio ecoicas silabas","Aleatorio escolares",
      "Aleatorio espejo","Aleatorio igualación auditiva","Aleatorio igualación 3D","Aleatorio imitación con objeto",
      "Aleatorio imitación c/s objeto","Aleatorio imitación sin objeto","Aleatorio lectura comprensiva","Aleatorio lectura palabras",
      "Aleatorio lectura silábica","Aleatorio partes del cuerpo","Aleatorio seguimiento instrucciones c/objeto",
      "Aleatorio seguimiento instrucciones s/objeto","Aleatorio tactos animales","Aleatorio tactos comida","Aleatorio tactos letras",
      "Aleatorio tactos números","Aleatorio tactos objetos","Aprestamiento","Asociaciones","Autonomía","Autoclíticos",
      "Búsqueda de objetos","Categorías","Cálculo mental","Colorear","Comida","Computación","Conceptos matemáticos",
      "Condicionamiento caras","Condicionamiento colorear","Condicionamiento encajables","Condicionamiento en mesa",
      "Condicionamiento paleta","Condicionamiento juegos","Condicionamiento libros","Condicionamiento libros en el suelo",
      "Condicionamiento plasticina","Condicionamiento saltar","Condicionamiento témperas","Condicionamiento rompecabezas",
      "Contacto visual","Conteo","Control postural","Copia","Copia bisilábica","Corte de cabello","Deícticos","Deletré",
      "Dictado letras","Dictado números","Dictado teclado","Dictado silabas","Discriminación","Discriminación auditiva",
      "Discriminación y lectura de palabras","Ecoica fonemas","Ecoica frases","Ecoica oraciones","Ecoica palabras",
      "Ecoica secuencias","Ecoica silabas","Entrenamiento a padres","Escritura","Espera","Esperar turno","Flexibilidad",
      "Habilidades numéricas","Historias","Hojas de trabajo","Igualación 2D/2D","Igualación 2D/3D","Igualación 3D/3D",
      "Igualación animales","Igualación auditiva","Igualación categorías","Igualación comida","Igualación de colores",
      "Igualación letras","Igualación números","Igualación objetos","Igualación palabras","Igualación partes del cuerpo",
      "Igualación silabas","Igualación táctil","Igualación texto/foto","Imitación c/s objeto","Imitación con objeto",
      "Imitación en espejo","Imitación sin objeto","Interacción juguetes","Interacción social","Intercambio de reforzadores",
      "Intraverbales","Lavado de dientes","Lectura comprensiva","Lectura global","Lectura oraciones","Lectura palabras",
      "Lectura silábica","Mandos","Mandos actividades","Mandos aversivos","Mandos comestibles","Mandos juguetes",
      "Mandos otros lugares","Matemáticas","Motor","Motricidad fina","Multiplicaciones","Número/numeral","Opuestos",
      "Oral motor","Partes del cuerpo","Praxias","Pre-escritura","Pre-escritura silabas","Pre-lectura","Pronombres",
      "Recortar","Reloj","Respuesta al nombre","Restas","Rimas","Rompecabezas","Secuencias","Seguimiento instrucciones c/s objeto",
      "Seguimiento instrucciones con objeto","Seguimiento instrucciones escritas","Seguimiento instrucciones sin objeto",
      "Seguimiento de instrucciones vocales","Selección 2D","Selección 3D","Selección acción","Selección animales",
      "Selección colores","Selección comida","Selección con características","Selección escolares","Selección fonemas",
      "Selección letras","Selección números","Selección objetos","Selección palabras","Selección partes del cuerpo",
      "Selección silabas","Selección varios","Señalar cuaderno","Sumas","Tacto acciones","Tacto animales","Tacto colores",
      "Tacto comida","Tacto emociones","Tacto escolares","Tacto impuro números","Tacto letras","Tactos lugares",
      "Tacto números","Tacto objetos","Tacto personas","Tacto profesiones","Tacto puro números","Tacto vestimenta",
      "Tactos sensoriales","Tactos situaciones","Tactos varios","Tiempo Colegio","Toma de perspectiva","Tracking visual"
    ];
    var terapeutas = [], estudiantes = [], programas = [];

    // 1) Poblar dropdowns
    function poblarDropdowns() {
      var t = document.getElementById('terapeuta'), e = document.getElementById('estudiante');
      t.innerHTML = '<option value="">-- selecciona terapeuta --</option>';
      e.innerHTML = '<option value="">-- selecciona estudiante --</option>';
      terapeutas.forEach(function(n){ var o=document.createElement('option'); o.value=o.text=n; t.add(o); });
      estudiantes.forEach(function(n){ var o=document.createElement('option'); o.value=o.text=n; e.add(o); });
    }

    // 2) GetConfig y fallback
    function getConfig(){
      var x=new XMLHttpRequest(); x.open('GET',scriptUrl+'?action=getConfig',true);
      x.onload=function(){
        if(x.status===200){
          try{
            var cfg=JSON.parse(x.responseText);
            if(cfg.terapeutas.length) terapeutas=cfg.terapeutas;
            if(cfg.estudiantes.length) estudiantes=cfg.estudiantes;
            if(cfg.programas.length)   programas=cfg.programas;
          }catch(e){ fallback(); }
        } else { fallback(); }
        poblarDropdowns(); renderAllConfig();
      };
      x.onerror=fallbackAndRender;
      x.send();
    }
    function fallback(){ terapeutas=defaultTerapeutas.slice(); estudiantes=defaultEstudiantes.slice(); programas=defaultProgramas.slice(); }
    function fallbackAndRender(){ fallback(); poblarDropdowns(); renderAllConfig(); }

    // 3) Configuración
    function renderConfigList(id,type,arr){
      var d=document.getElementById(id); d.innerHTML='';
      arr.forEach(function(name){
        var it=document.createElement('div'); it.className='list-item';
        var sp=document.createElement('span'); sp.textContent=name;
        var bt=document.createElement('button'); bt.className='delete-btn'; bt.textContent='Eliminar';
        bt.onclick=function(){ if(confirm('Eliminar '+name+'?')) saveConfig(type,name,true); };
        it.appendChild(sp); it.appendChild(bt); d.appendChild(it);
      });
    }
    function renderAllConfig(){ renderConfigList('list-terapeutas','terapeuta',terapeutas);
      renderConfigList('list-estudiantes','estudiante',estudiantes);
      renderConfigList('list-programas','programa',programas);
    }
    function saveConfig(type,name,remove){
      var x=new XMLHttpRequest(), p='action=saveConfig&type='+type+'&name='+encodeURIComponent(name)+(remove?'&remove=true':'');
      x.open('POST',scriptUrl,true); x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
      x.onload=function(){ if(x.status===200) getConfig(); else alert('Error config'); };
      x.send(p);
    }

    // 4) Agregar programa dinámico
    function agregarProgramaForm() {
  var cont = document.getElementById('programasContainer');
  var div  = document.createElement('div');
  div.className = 'program';
  var html = '';

  // 1) Selector de Programa
  html += '<label>Programa<select name="programa[]"><option value="">-- elige programa --</option>';
  programas.forEach(function(p){
    html += '<option>' + p + '</option>';
  });
  html += '</select></label>';

  // 2) Conj/Nivel, Elementos, Ensayos
  html += '<label>Conj/Nivel<input name="conj[]" type="text"></label>';
  html += '<label>Elementos<input name="elementos[]" type="text"></label>';
  html += '<label>Ensayos +<input name="positivos[]" type="number"></label>';
  html += '<label>Ensayos -<input name="negativos[]" type="number"></label>';

  // 3) Tipo de ayuda
  html += '<fieldset><legend>Tipo de ayuda</legend><div class="checkbox-group">';
  ['Ninguna','Verbal','Gestual','Física parcial','Física total','Física sombra'].forEach(function(a){
    var attr = 'ayuda' + a.replace(/\s+/g,'');
    html += '<label><input type="checkbox" name="' + attr + '[]"> ' + a + '</label>';
  });
  html += '</div></fieldset>';

  // 4) Tipo de reforzador
  html += '<fieldset><legend>Tipo de reforzador</legend><div class="checkbox-group">';
  ['Comestible','Sensorial','Social','Tangible','Economía','Actividad','Prueba/test'].forEach(function(r){
    var attr = 'ref' + r.replace(/\s+|\\//g,'');
    html += '<label><input type="checkbox" name="' + attr + '[]"> ' + r + '</label>';
  });
  html += '</div></fieldset>';

  // 5) Tipo de reforzamiento
  html += '<label>Tipo reforzamiento<select name="tipoRef[]">'
       + '<option value="">-- elige reforzamiento --</option>'
       + '<option>Continuo</option>'
       + '<option>Variable</option>'
       + '<option>Prueba/test</option>'
       + '</select></label>';

  // 6) Tiempos
  html += '<label>Tiempo colegio<input name="tiempoColegio[]" type="time"></label>';
  html += '<label>Tiempo papás<input name="tiempoPapas[]" type="time"></label>';

  // 7) Textareas
  html += '<label>Comportamiento relevante<textarea name="comportamiento[]"></textarea></label>';
  html += '<label>Comentario<textarea name="comentario[]"></textarea></label>';

  div.innerHTML = html;
  cont.appendChild(div);
}
    // 5) Guardar sesión
    function enviarDatos(){
      var f=document.getElementById('sessionForm'), fd=new FormData(f);
      fd.append('action','saveSession'); var x=new XMLHttpRequest(); x.open('POST',scriptUrl,true);
      x.onload=function(){ if(x.status===200) alert('Sesión guardada'), f.reset(),document.getElementById('programasContainer').innerHTML='' ;
        else alert('Error sesión'); };
      x.onerror=function(){ alert('Error conexión'); };
      x.send(fd);
    }

    // 6) Cambio de pestañas
    function showSection(idTab){
      document.getElementById('tab-form').classList.toggle('active', idTab==='form');
      document.getElementById('tab-config').classList.toggle('active', idTab==='config');
      document.getElementById('section-form').classList.toggle('active', idTab==='form');
      document.getElementById('section-config').classList.toggle('active', idTab==='config');
    }

    // 7) Listeners
    document.getElementById('addProgramBtn').onclick=agregarProgramaForm;
    document.getElementById('add-terapeuta-btn').onclick=function(){ var n=document.getElementById('new-terapeuta').value.trim(); if(n) saveConfig('terapeuta',n); };
    document.getElementById('add-estudiante-btn').onclick=function(){ var n=document.getElementById('new-estudiante').value.trim(); if(n) saveConfig('estudiante',n); };
    document.getElementById('add-programa-btn').onclick=function(){ var n=document.getElementById('new-programa').value.trim(); if(n) saveConfig('programa',n); };
    document.getElementById('sessionForm').onsubmit=function(e){ e.preventDefault(); enviarDatos(); };
    document.getElementById('tab-form').onclick=function(){ showSection('form'); };
    document.getElementById('tab-config').onclick=function(){ showSection('config'); };

    // 8) Inicialización
    document.addEventListener('DOMContentLoaded', function(){
      fallback(); poblarDropdowns(); renderAllConfig(); showSection('form'); getConfig();
    });
  </script>
</body>
</html>
