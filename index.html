<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATRÉVETE</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:10px; }
    h1 { font-size:24px; margin-bottom:20px; }
    .tabs { display:flex; margin-bottom:10px; }
    .tab { flex:1; padding:10px; text-align:center; cursor:pointer; background:#f0f0f0; border:1px solid #ccc; }
    .tab.active { background:#fff; border-bottom:none; font-weight:bold; }

    .section { display:none; }
    .section.active { display:block; }

    label, legend { display:block; margin-top:10px; font-size:16px; }
    select, input[type="text"], input[type="number"], input[type="time"], textarea, button { width:100%; font-size:16px; padding:8px; box-sizing:border-box; margin-top:5px; }
    button { height:48px; }

    .program { border:1px solid #ccc; margin-top:10px; padding:10px; }
    fieldset { border:1px solid #ccc; margin-top:15px; padding:10px; }
    .checkbox-group { display:flex; flex-wrap:wrap; margin-top:5px; }
    .checkbox-group label { width:48%; }
    .list-item { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
    .delete-btn {
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c;
      padding: 2px 6px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>ATRÉVETE</h1>

  <div class="tabs">
    <div id="tab-form" class="tab active">Sesión</div>
    <div id="tab-config" class="tab">Configuración</div>
  </div>

  <!-- Sección Sesión -->
  <div id="section-form" class="section active">
    <form id="sessionForm">
      <label for="terapeuta">Terapeuta</label>
      <select id="terapeuta" name="terapeuta">
        <option value="">-- selecciona terapeuta --</option>
      </select>

      <label for="estudiante">Estudiante</label>
      <select id="estudiante" name="estudiante">
        <option value="">-- selecciona estudiante --</option>
      </select>

      <div id="programasContainer"></div>
      <button type="button" id="addProgramBtn">+ Agregar Programa</button>
      <button type="submit">Guardar Sesión</button>
    </form>
  </div>

  <!-- Sección Configuración -->
  <div id="section-config" class="section">
    <fieldset>
      <legend>Terapeutas</legend>
      <button type="button" id="toggle-terapeutas">Mostrar Terapeutas</button>
      <div id="list-terapeutas" style="display:none; margin-top:10px;"></div>
      <input type="text" id="new-terapeuta" placeholder="Nombre nuevo terapeuta">
    </fieldset>
    <fieldset>
      <legend>Estudiantes</legend>
      <button type="button" id="toggle-estudiantes">Mostrar Estudiantes</button>
      <div id="list-estudiantes" style="display:none; margin-top:10px;"></div>
      <input type="text" id="new-estudiante" placeholder="Nombre nuevo estudiante">
    </fieldset>
    <fieldset>
      <legend>Programas</legend>
      <button type="button" id="toggle-programas">Mostrar Programas</button>
      <div id="list-programas" style="display:none; margin-top:10px;"></div>
      <input type="text" id="new-programa" placeholder="Nombre nuevo programa">
    </fieldset>
    <button type="button" id="save-config-btn">Guardar Configuración</button>
  </div>

  <script>
    // URL de la Web App
    var scriptUrl = 'https://script.google.com/macros/s/AKfycbxpuRuQqYozRLDdkVr-sCWrzZ1_TxSl_Jdrr_8z8Sk_GKaSxYDid2wzV3v4KXhqv79k/exec';

    // Arrays de datos
    var terapeutas = [], estudiantes = [], programas = [];

    // Función genérica GET
    function apiGet(params, cb) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', scriptUrl + '?' + params, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try { cb(null, JSON.parse(xhr.responseText)); }
          catch(e) { cb(e); }
        } else cb(new Error('HTTP ' + xhr.status));
      };
      xhr.onerror = function() { cb(new Error('Network error')); };
      xhr.send();
    }

    // Cargar configuración inicial
    function loadConfig() {
      apiGet('action=getConfig', function(err, res) {
        if (!err && res.status === 'success') {
          terapeutas = res.config.terapeutas;
          estudiantes = res.config.estudiantes;
          programas   = res.config.programas;
        }
        populateSessionDropdowns();
        renderConfigLists();
      });
    }

    // Poblar dropdowns de sesión
    function populateSessionDropdowns() {
      var tSel = document.getElementById('terapeuta'), eSel = document.getElementById('estudiante');
      tSel.innerHTML = '<option value="">-- selecciona terapeuta --</option>';
      eSel.innerHTML = '<option value="">-- selecciona estudiante --</option>';
      terapeutas.forEach(function(n){ var o=document.createElement('option'); o.value=o.text=n; tSel.add(o); });
      estudiantes.forEach(function(n){ var o2=document.createElement('option'); o2.value=o2.text=n; eSel.add(o2); });
    }

    // Renderizar listas de configuración
    function renderConfigLists() {
      renderList('list-terapeutas','terapeuta',terapeutas);
      renderList('list-estudiantes','estudiante',estudiantes);
      renderList('list-programas','programa',programas);
    }
    function renderList(id,type,arr) {
      var div=document.getElementById(id); div.innerHTML='';
      arr.forEach(function(name){
        var item=document.createElement('div'); item.className='list-item';
        var span=document.createElement('span'); span.textContent=name;
        var btn=document.createElement('button'); btn.className='delete-btn'; btn.textContent='Eliminar';
        btn.onclick=function(){ if(confirm('Eliminar '+name+'?')) apiGet('action=saveConfig&type='+type+'&name='+encodeURIComponent(name)+'&remove=true',loadConfig); };
        item.appendChild(span); item.appendChild(btn); div.appendChild(item);
      });
    }

    // Botón Guardar Configuración
    document.getElementById('save-config-btn').onclick = function() {
      var t=document.getElementById('new-terapeuta').value.trim();
      var e=document.getElementById('new-estudiante').value.trim();
      var p=document.getElementById('new-programa').value.trim();
      var count=0;
      function done(){ if(--count<=0) loadConfig(); }
      if(t){ count++; apiGet('action=saveConfig&type=terapeuta&name='+encodeURIComponent(t),done); }
      if(e){ count++; apiGet('action=saveConfig&type=estudiante&name='+encodeURIComponent(e),done); }
      if(p){ count++; apiGet('action=saveConfig&type=programa&name='+encodeURIComponent(p),done); }
      document.getElementById('new-terapeuta').value='';
      document.getElementById('new-estudiante').value='';
      document.getElementById('new-programa').value='';
      if(count===0) loadConfig();
    };

    // Agregar programa dinámico en sesión
    document.getElementById('addProgramBtn').onclick = function() {
      var cont = document.getElementById('programasContainer');
      var div = document.createElement('div'); div.className='program';
      var html = '';
      html += '<label>Programa<select name="programa[]"><option value="">-- elige programa --</option>';
      programas.forEach(function(pr){ html += '<option>'+pr+'</option>'; });
      html += '</select></label>';
      html += '<label>Conj/Nivel<input name="conj[]" type="text"></label>';
      html += '<label>Elementos<input name="elementos[]" type="text"></label>';
      html += '<label>Ensayos +<input name="positivos[]" type="number"></label>';
      html += '<label>Ensayos -<input name="negativos[]" type="number"></label>';
      html += '<fieldset><legend>Tipo de ayuda</legend><div class="checkbox-group">';
      ['Ninguna','Verbal','Gestual','Física parcial','Física total','Física sombra'].forEach(function(a){
        var attr='ayuda'+a.replace(/\s+/g,'');
        html += '<label><input type="checkbox" name="'+attr+'[]" value="'+a+'"> '+a+'</label>';
      });
      html += '</div></fieldset>';
      html += '<fieldset><legend>Tipo de reforzador</legend><div class="checkbox-group">';
      ['Comestible','Sensorial','Social','Tangible','Economía','Actividad','Prueba/test'].forEach(function(r){
        var attr='ref'+r.replace(/\s+|\//g,'');
        html += '<label><input type="checkbox" name="'+attr+'[]" value="'+r+'"> '+r+'</label>';
      });
      html += '</div></fieldset>';
      html += '<label>Tipo reforzamiento<select name="tipoRef[]"><option value="">-- elige reforzamiento --</option><option>Continuo</option><option>Variable</option><option>Prueba/test</option></select></label>';
      html += '<label>Tiempo colegio<input name="tiempoColegio[]" type="time"></label>';
      html += '<label>Tiempo papás<input name="tiempoPapas[]" type="time"></label>';
      html += '<label>Comportamiento relevante<textarea name="comportamiento[]"></textarea></label>';
      html += '<label>Comentario<textarea name="comentario[]"></textarea></label>';
      div.innerHTML = html;
      cont.appendChild(div);
    };

    // Enviar sesión
    document.getElementById('sessionForm').onsubmit = function(e) {
      e.preventDefault();
      var fd = new FormData(this);
      fd.append('action','saveSession');
      var xhr = new XMLHttpRequest(); xhr.open('POST', scriptUrl, true);
      xhr.onload = function() { if(xhr.status===200) alert('Sesión guardada'); else alert('Error al guardar'); };
      xhr.onerror = function() { alert('Error de conexión'); };
      xhr.send(fd);
    };

    // Toggles
    document.getElementById('toggle-terapeutas').onclick = function(){var d=document.getElementById('list-terapeutas');d.style.display=d.style.display==='none'?'block':'none';this.textContent=d.style.display==='block'?'Ocultar Terapeutas':'Mostrar Terapeutas';};
    document.getElementById('toggle-estudiantes').onclick = function(){var d=document.getElementById('list-estudiantes');d.style.display=d.style.display==='none'?'block':'none';this.textContent=d.style.display==='block'?'Ocultar Estudiantes':'Mostrar Estudiantes';};
    document.getElementById('toggle-programas').onclick = function(){var d=document.getElementById('list-programas');d.style.display=d.style.display==='none'?'block':'none';this.textContent=d.style.display==='block'?'Ocultar Programas':'Mostrar Programas';};

    // Pestañas
    function show(tab) {
      document.getElementById('tab-form').classList.toggle('active', tab==='form');
      document.getElementById('tab-config').classList.toggle('active', tab==='config');
      document.getElementById('section-form').classList.toggle('active', tab==='form');
      document.getElementById('section-config').classList.toggle('active', tab==='config');
    }
    document.getElementById('tab-form').onclick   = function(){show('form');};
    document.getElementById('tab-config').onclick = function(){show('config');};

    window.addEventListener('load', function(){ loadConfig(); show('form'); });
  </script>
</body>
</html>
